<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>注文内容の確認 | Pizza Smile</title>
<style>
:root{--red:#e51d2a;--dark:#1e1e1e;--cream:#fffaf3;--line:#e8e3dc;--muted:#777}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--dark);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}
header{background:#171717;color:white}.wrap{max-width:920px;margin:auto;padding:0 18px}.nav{height:68px;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:900;font-size:20px}.logo span{color:#ffd22e}
main{padding:44px 0 70px}.steps{display:flex;justify-content:center;gap:0;margin:0 auto 35px;max-width:650px}.step{flex:1;text-align:center;position:relative;color:#aaa;font-size:13px}.step:after{content:"";position:absolute;top:13px;left:50%;width:100%;height:2px;background:#ddd;z-index:0}.step:last-child:after{display:none}.dot{position:relative;z-index:1;margin:auto auto 8px;width:28px;height:28px;border-radius:50%;background:#ddd;color:#fff;display:grid;place-items:center;font-weight:800}.step.active{color:var(--red);font-weight:800}.step.active .dot{background:var(--red)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:18px;box-shadow:0 5px 18px #00000008}.card h2{margin:0 0 18px;font-size:21px}
.item{display:flex;align-items:center;gap:16px;padding:15px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.emoji{font-size:48px;width:70px;height:70px;border-radius:12px;background:#fff2dd;display:grid;place-items:center}.grow{flex:1}.price{font-weight:900}
.info{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{background:#faf8f4;border-radius:12px;padding:13px}.field small{display:block;color:var(--muted);margin-bottom:5px}.field b{font-size:15px}
.total{display:flex;justify-content:space-between;font-size:24px;font-weight:900;padding-top:15px}.btn{border:0;border-radius:12px;background:var(--red);color:#fff;font-weight:800;padding:15px 24px;cursor:pointer;width:100%;font-size:16px}.subbtn{margin-top:10px;background:white;color:var(--red);border:1px solid var(--red)}
.empty{text-align:center;padding:40px 10px}.notice{background:#fff5d8;border:1px solid #f1d98b;padding:13px 15px;border-radius:10px;margin-bottom:18px;font-size:14px}
@media(max-width:650px){.info{grid-template-columns:1fr}.steps{font-size:11px}.card{padding:18px}}
</style>
</head>
<body>
<header><div class="wrap nav"><div class="logo">🍕 <span>Pizza</span> · Smile</div><div>注文内容確認</div></div></header>
<main><div class="wrap">
<div class="steps">
 <div class="step active"><div class="dot">1</div>注文内容</div>
 <div class="step"><div class="dot">2</div>情報入力</div>
 <div class="step"><div class="dot">3</div>注文完了</div>
</div>
<div id="content"></div>
</div></main>
<script>
const cart=JSON.parse(localStorage.getItem("pizzaSmileCart")||"[]");
const extra={Mysize:0,S:0,M:300,L:700};
function yen(n){return "¥"+n.toLocaleString("ja-JP")}
function render(){
 const el=document.getElementById("content");
 if(!cart.length){
   el.innerHTML='<div class="card empty"><h2>カートは空です</h2><p>注文する商品を選んでください。</p><a href="index.html"><button class="btn">メニューへ戻る</button></a></div>'; return;
 }
 const subtotal=cart.reduce((s,p)=>s+p.price,0);
 const delivery= subtotal>=10000 ? 0 : 400;
 el.innerHTML=`
 <div class="notice">ご注文の商品・サイズ・数量をご確認ください。</div>
 <div class="card"><h2>🛒 ご注文の商品</h2>
 ${cart.map(p=>`<div class="item"><div class="emoji">${p.emoji}</div><div class="grow"><b>${p.name}</b><br><span style="color:#777">サイズ：${p.size}　数量：${p.qty||1}</span></div><div class="price">${yen(p.price*(p.qty||1))}</div></div>`).join("")}
 <div class="total"><span>商品合計</span><span>${yen(subtotal)}</span></div>
 <div style="display:flex;justify-content:space-between;margin-top:8px;color:#666"><span>配送料</span><span>${delivery?yen(delivery):"無料"}</span></div>
 <div class="total"><span>お支払い合計</span><span>${yen(subtotal+delivery)}</span></div>
 </div>
 <div class="card"><h2>📍 お届け先・注文方法</h2>
 <div class="info">
  <div class="field"><small>お名前</small><b>山田 太郎</b></div>
  <div class="field"><small>電話番号</small><b>090-1234-5678</b></div>
  <div class="field"><small>お届け先</small><b>東京都渋谷区渋谷1-2-3</b></div>
  <div class="field"><small>お届け希望時間</small><b>18:00〜19:00</b></div>
  <div class="field"><small>注文方法</small><b>配達</b></div>
  <div class="field"><small>お支払い</small><b>クレジットカード</b></div>
 </div></div>
 <button class="btn" onclick="completeOrder()">この内容で注文を確定する →</button>
 <a href="index.html"><button class="btn subbtn">メニューに戻る</button></a>`;
}
function completeOrder(){
 const orderNo="PS"+Date.now().toString().slice(-8);
 const subtotal=cart.reduce((s,p)=>s+p.price*(p.qty||1),0);
 const delivery=subtotal>=10000?0:400;
 const order={
   id:orderNo,
   createdAt:new Date().toISOString(),
   status:"新規",
   customer:{name:"山田 太郎",phone:"090-1234-5678",address:"東京都渋谷区渋谷1-2-3",time:"18:00〜19:00"},
   payment:"クレジットカード",
   items:cart,
   subtotal,
   delivery,
   total:subtotal+delivery
 };
 const orders=JSON.parse(localStorage.getItem("pizzaSmileOrders")||"[]");
 orders.unshift(order);
 localStorage.setItem("pizzaSmileOrders",JSON.stringify(orders));
 localStorage.removeItem("pizzaSmileCart");
 document.getElementById("content").innerHTML=`<div class="card empty"><div style="font-size:70px">🎉</div><h2>ご注文ありがとうございます！</h2><p>ご注文を受け付けました。</p><div class="field" style="margin:20px auto;max-width:420px"><small>注文番号</small><b>${orderNo}</b></div><a href="index.html"><button class="btn">トップページへ戻る</button></a></div>`;
}
render();
</script>
</body>
</html>
