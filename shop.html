<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pizza Smile | 店舗注文管理</title>
<style>
:root{--red:#e51d2a;--dark:#171717;--cream:#f7f5f1;--line:#e5e1db;--muted:#777;--green:#1b8f55}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}
header{background:var(--dark);color:#fff}.wrap{max-width:1240px;margin:auto;padding:0 20px}.nav{height:70px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:20px;font-weight:900}.logo span{color:#ffd22e}.shop-label{font-size:13px;color:#ddd}
main{padding:30px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:25px}.top h1{margin:0;font-size:28px}.actions{display:flex;gap:10px}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer}.refresh{background:#fff;border:1px solid var(--line)}.clear{background:#fee;color:#c11;border:1px solid #f2bcbc}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.stat small{color:var(--muted)}.stat b{display:block;font-size:28px;margin-top:5px}
.notice{display:none;background:#fff1c9;border:1px solid #e4c968;padding:13px 16px;border-radius:10px;margin-bottom:18px;font-weight:800}.notice.show{display:block}
.orders{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.order{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 4px 15px #00000008}.order.new{border:2px solid var(--red)}
.order-head{padding:17px 18px;background:#faf9f7;display:flex;justify-content:space-between;gap:10px}.order-no{font-weight:900}.time{font-size:13px;color:var(--muted)}
.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#ffe1e3;color:#c21824;font-size:12px;font-weight:900}.badge.preparing{background:#fff0ca;color:#9a6500}.badge.done{background:#dcf5e8;color:#147344}
.body{padding:18px}.item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.emoji{font-size:34px}.grow{flex:1}.item small{color:var(--muted)}.total{display:flex;justify-content:space-between;font-size:20px;font-weight:900;padding-top:15px}
.info{background:#f8f6f2;border-radius:10px;padding:12px;margin-top:14px;font-size:14px;line-height:1.8}.controls{display:flex;gap:8px;margin-top:15px}.status{flex:1;padding:10px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:700}.donebtn{background:var(--green);color:#fff;border-color:var(--green)}
.empty{background:#fff;border:1px solid var(--line);border-radius:16px;padding:55px 20px;text-align:center;color:var(--muted)}
@media(max-width:850px){.orders{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.top{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr 1fr}.wrap{padding:0 12px}}
</style>
</head>
<body>
<header><div class="wrap nav"><div class="logo">🍕 <span>Pizza</span> · Smile</div><div class="shop-label">店舗スタッフ用 注文管理</div></div></header>
<main><div class="wrap">
<div class="top"><div><h1>注文管理</h1><p style="color:#777;margin:6px 0">お客様から届いた注文をリアルタイムで確認できます。</p></div><div class="actions"><button class="btn refresh" onclick="render(true)">↻ 更新</button><button class="btn clear" onclick="clearDone()">完了済みを削除</button></div></div>
<div id="notice" class="notice">🔔 新しい注文が入りました！</div>
<div class="stats">
 <div class="stat"><small>未対応</small><b id="newCount">0</b></div>
 <div class="stat"><small>調理中</small><b id="prepCount">0</b></div>
 <div class="stat"><small>本日の注文</small><b id="todayCount">0</b></div>
 <div class="stat"><small>本日の売上</small><b id="sales">¥0</b></div>
</div>
<div id="orders" class="orders"></div>
</div></main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  updateDoc,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCR6FU6svHeMVrm9l7nLRtCpjcANPIgvHk",
  authDomain: "pizza-wac.firebaseapp.com",
  projectId: "pizza-wac",
  storageBucket: "pizza-wac.firebasestorage.app",
  messagingSenderId: "512163867712",
  appId: "1:512163867712:web:5e409f03a51f5f059483a5",
  measurementId: "G-GCV48TWPXS"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let orders = [];
let lastCount = 0;

function yen(n) {
  return "¥" + Number(n || 0).toLocaleString("ja-JP");
}

function statusClass(s) {
  return s === "調理中" ? "preparing" :
         s === "完了" ? "done" : "";
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[c]);
}

function render(notify = false) {
  const newCount = orders.filter(o => o.status === "新規").length;
  const prepCount = orders.filter(o => o.status === "調理中").length;

  const today = new Date().toLocaleDateString("ja-JP", {
    timeZone: "Asia/Tokyo"
  });

  const todays = orders.filter(o =>
    new Date(o.createdAt).toLocaleDateString("ja-JP", {
      timeZone: "Asia/Tokyo"
    }) === today
  );

  document.getElementById("newCount").textContent = newCount;
  document.getElementById("prepCount").textContent = prepCount;
  document.getElementById("todayCount").textContent = todays.length;
  document.getElementById("sales").textContent =
    yen(todays.reduce((sum, o) => sum + Number(o.total || 0), 0));

  if (notify && newCount > lastCount) {
    document.getElementById("notice").classList.add("show");
  }
  lastCount = newCount;

  const el = document.getElementById("orders");

  if (!orders.length) {
    el.innerHTML = '<div class="empty">📭<br><br>まだ注文はありません。</div>';
    return;
  }

  el.innerHTML = orders.map(o => {
    const customer = o.customer || {};
    const items = Array.isArray(o.items) ? o.items : [];

    return `
      <article class="order ${o.status === "新規" ? "new" : ""}">
        <div class="order-head">
          <div>
            <div class="order-no">#${escapeHTML(o.id)}</div>
            <div class="time">${escapeHTML(
              new Date(o.createdAt).toLocaleString("ja-JP")
            )}</div>
          </div>
          <span class="badge ${statusClass(o.status)}">
            ${escapeHTML(o.status)}
          </span>
        </div>
        <div class="body">
          ${items.map(p => `
            <div class="item">
              <div class="emoji">${escapeHTML(p.emoji || "🍕")}</div>
              <div class="grow">
                <b>${escapeHTML(p.name)}</b><br>
                <small>サイズ：${escapeHTML(p.size)}　数量：${Number(p.qty || 1)}</small>
              </div>
              <b>${yen(Number(p.price || 0) * Number(p.qty || 1))}</b>
            </div>
          `).join("")}
          <div class="info">
            <b>お客様</b>：${escapeHTML(customer.name)}<br>
            <b>電話</b>：${escapeHTML(customer.phone)}<br>
            <b>お届け先</b>：${escapeHTML(customer.address)}<br>
            <b>希望時間</b>：${escapeHTML(customer.time)}<br>
            <b>支払</b>：${escapeHTML(o.payment)}
          </div>
          <div class="total">
            <span>合計</span><span>${yen(o.total)}</span>
          </div>
          <div class="controls">
            <button class="status" data-doc="${o._docId}" data-status="新規">新規</button>
            <button class="status" data-doc="${o._docId}" data-status="調理中">調理中</button>
            <button class="status donebtn" data-doc="${o._docId}" data-status="完了">完了</button>
          </div>
        </div>
      </article>
    `;
  }).join("");

  el.querySelectorAll("[data-doc]").forEach(button => {
    button.addEventListener("click", async () => {
      try {
        await updateDoc(doc(db, "orders", button.dataset.doc), {
          status: button.dataset.status
        });
      } catch (error) {
        console.error(error);
        alert("状態を更新できませんでした。Firestore のルールを確認してください。");
      }
    });
  });
}

window.render = () => render(false);

window.clearDone = async () => {
  const completed = orders.filter(o => o.status === "完了");

  if (!completed.length) {
    alert("削除できる完了済み注文はありません。");
    return;
  }

  if (!confirm(`完了済みの注文 ${completed.length} 件を削除しますか？`)) {
    return;
  }

  try {
    await Promise.all(completed.map(o =>
      deleteDoc(doc(db, "orders", o._docId))
    ));
  } catch (error) {
    console.error(error);
    alert("削除できませんでした。Firestore の削除ルールを確認してください。");
  }
};

onSnapshot(collection(db, "orders"), snapshot => {
  orders = snapshot.docs.map(d => ({
    ...d.data(),
    _docId: d.id
  }));

  orders.sort((a, b) =>
    String(b.createdAt || "").localeCompare(String(a.createdAt || ""))
  );

  render(true);
}, error => {
  console.error(error);
  document.getElementById("orders").innerHTML =
    '<div class="empty">注文を読み込めませんでした。Firebase の設定とルールを確認してください。</div>';
});
</script>

</body>
</html>
